<!doctype html>
<html lang="en" style="background-color: #050816; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Critical instant dark background style (guarantees dark background even in Incognito with 0ms delay) -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body, #root {
        background-color: #050816 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }
    </style>

    <!-- SEO Meta Tags -->
    <title>Swaraj Pakhale | Java & Full Stack Developer Portfolio</title>
    <meta name="description" content="Swaraj Pakhale - Java, Spring Boot, and React Developer. B.Tech Computer Technology student at YCCE Nagpur. Explore projects, skills, education, and experience." />
    <meta name="keywords" content="Swaraj Pakhale, Swaraj, Pakhale, Swaraj Pakhale portfolio, Swaraj Pakhale developer, Swaraj Pakhale YCCE, Swaraj Pakhale Nagpur, Java developer, Spring Boot developer, React developer, full stack developer, B.Tech Computer Technology YCCE Nagpur, software engineer portfolio, Swaraj Pakhale resume, Swaraj Pakhale projects" />
    <meta name="author" content="Swaraj Pakhale" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Swaraj Pakhale | Java & Full Stack Developer" />
    <meta property="og:description" content="Swaraj Pakhale - Java, Spring Boot, and React Developer from YCCE Nagpur. B.Tech Computer Technology. View portfolio, projects, and education." />
    <meta property="og:site_name" content="Swaraj Pakhale Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swaraj Pakhale | Java & Full Stack Developer" />
    <meta name="twitter:description" content="Swaraj Pakhale - Java, Spring Boot, and React Developer from YCCE Nagpur. Explore portfolio, projects, and skills." />

    <!-- Structured Data / JSON-LD for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Swaraj Pakhale",
      "jobTitle": "Java & Full Stack Developer",
      "description": "Swaraj Pakhale is a Java, Spring Boot, and React Developer, B.Tech Computer Technology student at YCCE Nagpur.",
      "alumniOf": [
        {
          "@type": "CollegeOrUniversity",
          "name": "Yeshwantrao Chavan College of Engineering (YCCE), Nagpur",
          "department": "Computer Technology"
        },
        {
          "@type": "HighSchool",
          "name": "Vidya Niketan 12th College, Chandrapur"
        },
        {
          "@type": "HighSchool",
          "name": "Mount Carmel Convent Senior Secondary School, Ghugus, Chandrapur"
        }
      ],
      "knowsAbout": ["Java", "Spring Boot", "React", "TypeScript", "JavaScript", "PostgreSQL", "C++", "C", "REST APIs", "SQL"],
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "Bachelor of Technology",
          "educationalLevel": "B.Tech in Computer Technology",
          "recognizedBy": { "@type": "Organization", "name": "YCCE Nagpur" }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
